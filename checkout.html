<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Stapleford Watches</title>
  <style>
    @font-face{font-family:"Sweet Sans Pro";src:url("/fonts/fonnts.com-SweetSansProRegular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Sweet Sans Pro",Arial,sans-serif;color:#000;background:#fff;min-height:100vh}
    .checkout-shell{width:min(100%,520px);margin:0 auto;padding:28px 14px 48px}
    .checkout-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
    .checkout-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
    .checkout-back{color:#000;text-decoration:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .checkout-copy{font-size:12px;line-height:1.65;letter-spacing:.02em;margin:0 0 18px;color:rgba(0,0,0,.72)}
    .delivery-options{display:grid;gap:8px;margin:18px 0 14px}
    .delivery-option{appearance:none;-webkit-appearance:none;width:100%;min-height:46px;border:1px solid #000;background:#fff;color:#000;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-align:left}
    .delivery-option[aria-pressed="true"]{background:#000;color:#fff}
    .delivery-main{display:flex;flex-direction:column;gap:3px}
    .delivery-note{font-size:10px;letter-spacing:.04em;text-transform:none;opacity:.68}
    .checkout-submit{appearance:none;-webkit-appearance:none;width:100%;min-height:46px;border:1px solid #000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:12px 14px;font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:12px}
    .checkout-submit:disabled{opacity:.45;cursor:default}
    .checkout-message{font-size:11px;line-height:1.55;letter-spacing:.04em;text-transform:uppercase;color:rgba(0,0,0,.62);text-align:center;margin-top:14px}
    .checkout-message[hidden]{display:none!important}
    @media(max-width:640px){.checkout-shell{padding:18px 10px 36px}.checkout-header{margin-bottom:22px}}
  </style>
</head>
<body>
  <main class="checkout-shell">
    <header class="checkout-header">
      <h1 class="checkout-title">Secure checkout</h1>
      <a class="checkout-back" href="/buy/">Back to watches</a>
    </header>
    <p class="checkout-copy">Choose your delivery region, then continue to Stripe secure checkout.</p>
    <div class="delivery-options" role="group" aria-label="Delivery region">
      <button class="delivery-option" type="button" data-region="uk" aria-pressed="true"><span class="delivery-main"><span>United Kingdom</span><span class="delivery-note">Tracked insured delivery</span></span><span>Free</span></button>
      <button class="delivery-option" type="button" data-region="europe" aria-pressed="false"><span class="delivery-main"><span>Europe</span><span class="delivery-note">Tracked insured delivery</span></span><span>£50</span></button>
      <button class="delivery-option" type="button" data-region="world" aria-pressed="false"><span class="delivery-main"><span>Rest of world</span><span class="delivery-note">Tracked insured delivery</span></span><span>£80</span></button>
    </div>
    <button class="checkout-submit" id="checkoutSubmit" type="button">Continue to Stripe</button>
    <p id="checkoutMessage" class="checkout-message" hidden></p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const watchId = params.get('watch');
      const buttons = Array.from(document.querySelectorAll('.delivery-option'));
      const submit = document.getElementById('checkoutSubmit');
      const message = document.getElementById('checkoutMessage');
      let deliveryRegion = 'uk';
      function show(text){ if(message){ message.textContent = text || ''; message.hidden = !text; } }
      function setRegion(region){
        deliveryRegion = region || 'uk';
        buttons.forEach(button => button.setAttribute('aria-pressed', button.dataset.region === deliveryRegion ? 'true' : 'false'));
      }
      buttons.forEach(button => button.addEventListener('click', () => setRegion(button.dataset.region)));
      if(!watchId){ submit.disabled = true; show('No watch was selected. Please go back and choose a watch.'); return; }
      submit.addEventListener('click', async () => {
        const original = submit.textContent;
        submit.disabled = true;
        submit.textContent = 'Loading';
        show('');
        try{
          const response = await fetch('/create-stripe-checkout', {
            method:'POST',
            headers:{ 'Content-Type':'application/json', Accept:'application/json' },
            body:JSON.stringify({ items:[{ id:watchId, quantity:1 }], deliveryRegion })
          });
          const data = await response.json().catch(() => ({}));
          if(!response.ok || !data.checkoutUrl) throw new Error(data.error || 'Checkout unavailable.');
          window.location.href = data.checkoutUrl;
        }catch(error){
          console.error(error);
          show(error.message || 'Checkout could not be loaded. Please contact Stapleford Watches.');
          submit.disabled = false;
          submit.textContent = original || 'Continue to Stripe';
        }
      });
    })();
  </script>
</body>
</html>
