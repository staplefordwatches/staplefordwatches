}

}

}

/* ===== GLOBAL PAGE LOCKDOWN ===== */
document.addEventListener('copy', function(e){
  e.preventDefault();
}, true);

document.addEventListener('cut', function(e){
  e.preventDefault();
}, true);

document.addEventListener('keydown', function(e){
  const key = (e.key || '').toLowerCase();
  const isMod = e.ctrlKey || e.metaKey;
  if (isMod && ['c','x','a','s','u','p'].includes(key)) {
    e.preventDefault();
  }
  if (key === 'printscreen') {
    e.preventDefault();
  }
}, true);

document.addEventListener('mousedown', function(e){
  if (e.detail > 1) e.preventDefault();

<script>
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll("[data-custom-select]").forEach(function(select){
    const trigger = select.querySelector(".custom-select-trigger");
    const input = select.querySelector("input[type='hidden']");
    const options = select.querySelectorAll(".custom-select-options button");
    if(input && input.value){
      select.classList.add("has-value");
    }

    trigger.addEventListener("click", function(){
      const isOpen = select.classList.toggle("is-open");
      trigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    options.forEach(function(option){
      option.addEventListener("click", function(){
        input.value = option.dataset.value || option.textContent.trim();
        trigger.textContent = option.textContent.trim();
        select.classList.add("has-value");
        select.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      });
    });

    document.addEventListener("click", function(event){
      if(!select.contains(event.target)){
        select.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
      }
    });
  });
});
</script>
<script id="stapleford-mobile-cart-visual-viewport-fix">
(function(){
  function setCartViewportVars(){
    var viewport = window.visualViewport;
    var width = viewport && viewport.width ? viewport.width : window.innerWidth;
    var height = viewport && viewport.height ? viewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--stapleford-visual-vw', Math.round(width) + 'px');
    document.documentElement.style.setProperty('--stapleford-visual-vh', Math.round(height) + 'px');
  }

  setCartViewportVars();
  window.addEventListener('resize', setCartViewportVars, { passive:true });
  window.addEventListener('orientationchange', function(){
    setCartViewportVars();
    setTimeout(setCartViewportVars, 250);
  }, { passive:true });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setCartViewportVars, { passive:true });
    window.visualViewport.addEventListener('scroll', setCartViewportVars, { passive:true });
  }
})();
</script>
<script id="stapleford-swipe-carousel-no-thumbnails-v6-js">
(function(){
  function removeThumbGallery(){
    document.querySelectorAll('#lightboxThumbs, .lightbox-thumbs').forEach(function(el){
      el.innerHTML = '';
      el.setAttribute('hidden', 'hidden');
      el.setAttribute('aria-hidden', 'true');
    });
  }

  removeThumbGallery();

  var observer = new MutationObserver(removeThumbGallery);
  observer.observe(document.documentElement, { childList:true, subtree:true });

  var startX = 0;
  var startY = 0;
  var swiping = false;

  function move(direction){
    if(typeof stepLightbox === 'function'){
      stepLightbox(direction);
      removeThumbGallery();
      return;
    }
    var selector = direction > 0 ? '.lightbox-next' : '.lightbox-prev';
    var btn = document.querySelector(selector);
    if(btn) btn.click();
    removeThumbGallery();
  }

  document.addEventListener('touchstart', function(e){
    var wrap = e.target.closest && e.target.closest('.lightbox-image-wrap');
    if(!wrap || !document.querySelector('.lightbox.open')) return;
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    startX = t.clientX;
    startY = t.clientY;
    swiping = true;
  }, { passive:true });

  document.addEventListener('touchend', function(e){
    if(!swiping || !document.querySelector('.lightbox.open')) return;
    var wrap = e.target.closest && e.target.closest('.lightbox-image-wrap');
    if(!wrap) return;
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    swiping = false;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3){
      e.preventDefault();
      e.stopPropagation();
      move(dx < 0 ? 1 : -1);
    }
  }, { passive:false });

  document.addEventListener('click', function(){
    if(document.querySelector('.lightbox.open')){
      window.setTimeout(removeThumbGallery, 0);
    }
  }, true);
})();
</script>

<script id="stapleford-single-native-image-v10-js">
(function(){
  function cleanupProductGallery(){
    document.querySelectorAll('#staplefordPreviewTrack, .stapleford-preview-track, #lightboxThumbs, .lightbox-thumbs, .lightbox-thumb').forEach(function(el){
      if(el.id === 'lightboxThumbs' || el.classList.contains('lightbox-thumbs')){
        el.innerHTML = '';
        el.setAttribute('hidden', 'hidden');
        el.setAttribute('aria-hidden', 'true');
        el.style.display = 'none';
      }else{
        el.remove();
      }
    });

    document.querySelectorAll('.lightbox-prev, .lightbox-next').forEach(function(el){
      el.setAttribute('hidden', 'hidden');
      el.setAttribute('aria-hidden', 'true');
      el.style.display = 'none';
    });

    var img = document.getElementById('lightboxImage');
    if(img){
      img.style.display = 'block';
      img.style.visibility = 'visible';
      img.style.opacity = '1';
    }
  }

  /* Stop the earlier preview-carousel code from rebuilding a second stacked image rail. */
  window.renderSwipePreviewTrack = cleanupProductGallery;
  window.positionSwipePreviewTrack = cleanupProductGallery;

  function swipe(direction){
    if(typeof stepLightbox === 'function'){
      stepLightbox(direction);
      setTimeout(cleanupProductGallery, 0);
      return;
    }
    var selector = direction > 0 ? '.lightbox-next' : '.lightbox-prev';
    var btn = document.querySelector(selector);
    if(btn) btn.click();
    setTimeout(cleanupProductGallery, 0);
  }

  var startX = 0;
  var startY = 0;
  var active = false;

  document.addEventListener('touchstart', function(e){
    var wrap = e.target.closest && e.target.closest('.lightbox-image-wrap');
    if(!wrap || !document.querySelector('.lightbox.open')) return;
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    startX = t.clientX;
    startY = t.clientY;
    active = true;
  }, { passive:true });

  document.addEventListener('touchend', function(e){
    if(!active || !document.querySelector('.lightbox.open')) return;
    var wrap = e.target.closest && e.target.closest('.lightbox-image-wrap');
    if(!wrap) return;
    var t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    active = false;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.25){
      e.preventDefault();
      e.stopPropagation();
      swipe(dx < 0 ? 1 : -1);
    }
  }, { passive:false });

  cleanupProductGallery();
  document.addEventListener('click', function(){ setTimeout(cleanupProductGallery, 0); }, true);
  window.addEventListener('resize', cleanupProductGallery, { passive:true });
  window.addEventListener('load', cleanupProductGallery, { passive:true });
})();
</script>

    var track = document.getElementById('staplefordPreviewTrack');
    if(!wrap || !track) return;
    var width = Math.round(wrap.clientWidth || track.clientWidth || 0);
    if(!width) return;
    track.querySelectorAll('.stapleford-preview-slide').forEach(function(slide){
      slide.style.flexBasis = '100%';
      slide.style.width = width + 'px';
      slide.style.minWidth = width + 'px';
      slide.style.maxWidth = width + 'px';
    });
    var index = (typeof window.lightboxIndex === 'number') ? window.lightboxIndex : 0;
    track.style.transform = 'translate3d(' + (-index * width) + 'px, 0, 0)';
  }
  window.addEventListener('resize', function(){ window.setTimeout(refreshProductTrack, 60); }, { passive:true });
  window.addEventListener('orientationchange', function(){ window.setTimeout(refreshProductTrack, 180); }, { passive:true });
  document.addEventListener('click', function(){ window.setTimeout(refreshProductTrack, 80); }, true);
  window.setTimeout(refreshProductTrack, 0);
})();

<script id="sw-v61-related-rail-premium-step-scroll-js">
(function(){
  var RAIL_SELECTOR = '#lightboxRelatedGrid';
  var LIGHTBOX_SELECTOR = '#lightbox.open';
  var REDUCED_MOTION_QUERY = '(prefers-reduced-motion: reduce)';
  var STEP_DELAY_MS = 3800;
  var STEP_SETTLE_MS = 1100;
  var START_DELAY_MS = 900;
  var DRAG_THRESHOLD = 5;
  var RETRY_LIMIT = 24;

  var reduceMotionQuery = window.matchMedia ? window.matchMedia(REDUCED_MOTION_QUERY) : null;
  var reduceMotion = reduceMotionQuery ? reduceMotionQuery.matches : false;

  var state = {
    rail:null,
    timer:0,
    settleTimer:0,
    retryCount:0,
    direction:1,
    hoverPaused:false,
    stoppedByCustomer:false,
    dragging:false,
    moved:false,
    suppressClick:false,
    pointerId:null,
    startX:0,
    startScrollLeft:0,
    preparedRail:null,
    mutationObserver:null
  };

  function rail(){
    return document.querySelector(RAIL_SELECTOR);
  }

  function lightboxIsOpen(){
    return Boolean(document.querySelector(LIGHTBOX_SELECTOR)) && document.body.classList.contains('product-page-open');
  }

  function hasRoomToScroll(el){
    return Boolean(el && el.children.length > 2 && el.scrollWidth > el.clientWidth + 8);
  }

  function customerCanSeeRail(el){
    return Boolean(el && el.offsetParent !== null);
  }

  function canRun(el){
    if(!el) return false;
    if(reduceMotion) return false;
    if(document.hidden) return false;
    if(!lightboxIsOpen()) return false;
    if(!customerCanSeeRail(el)) return false;
    if(!hasRoomToScroll(el)) return false;
    if(state.hoverPaused || state.stoppedByCustomer || state.dragging) return false;
    return true;
  }

  function clearTimers(){
    if(state.timer){
      window.clearTimeout(state.timer);
      state.timer = 0;
    }
    if(state.settleTimer){
      window.clearTimeout(state.settleTimer);
      state.settleTimer = 0;
    }
  }

  function getStep(el){
    var first = el.querySelector('.lightbox-related-card');
    if(!first) return Math.max(120, el.clientWidth * 0.52);
    var second = first.nextElementSibling;
    if(second) return Math.max(120, second.offsetLeft - first.offsetLeft);
    return Math.max(120, first.getBoundingClientRect().width + 12);
  }

  function smoothScrollTo(el, left){
    try{
      el.scrollTo({ left:left, behavior:'smooth' });
    }catch(error){
      el.scrollLeft = left;
    }
  }

  function schedule(delay){
    clearTimers();
    var wait = typeof delay === 'number' ? delay : STEP_DELAY_MS;

    state.timer = window.setTimeout(function(){
      state.timer = 0;
      advance();
    }, wait);
  }

  function retryOrStop(){
    if(lightboxIsOpen() && !state.stoppedByCustomer && state.retryCount < RETRY_LIMIT){
      state.retryCount += 1;
      schedule(250);
    }
  }

  function advance(){
    var el = state.rail || rail();
    state.rail = el;

    if(!canRun(el)){
      retryOrStop();
      return;
    }

    state.retryCount = 0;

    var maxScrollLeft = Math.max(0, el.scrollWidth - el.clientWidth);
    if(maxScrollLeft <= 8) return;

    var step = getStep(el);
    var current = el.scrollLeft;
    var next = current + (step * state.direction);

    if(next >= maxScrollLeft - 4){
      next = maxScrollLeft;
      state.direction = -1;
    }else if(next <= 4){
      next = 0;
      state.direction = 1;
    }

    smoothScrollTo(el, next);

    state.settleTimer = window.setTimeout(function(){
      state.settleTimer = 0;
      if(canRun(el)) schedule(STEP_DELAY_MS);
    }, STEP_SETTLE_MS);
  }

  function startSoon(){
    clearTimers();
    state.timer = window.setTimeout(function(){
      state.timer = 0;
      var el = state.rail || rail();
      state.rail = el;
      if(canRun(el)){
        schedule(STEP_DELAY_MS);
      }else{
        retryOrStop();
      }
    }, START_DELAY_MS);
  }

  function stopForCustomer(){
    state.stoppedByCustomer = true;
    clearTimers();
  }

  function resetForProduct(){
    clearTimers();
    state.rail = rail();
    state.retryCount = 0;
    state.direction = 1;
    state.hoverPaused = false;
    state.stoppedByCustomer = false;
    state.dragging = false;
    state.moved = false;
    state.suppressClick = false;
    state.pointerId = null;

    if(state.rail){
      state.rail.classList.remove('is-dragging');
      state.rail.scrollLeft = 0;
      prepareRail(state.rail);
    }

    startSoon();
  }

  function prepareRail(el){
    if(!el || state.preparedRail === el) return;
    state.preparedRail = el;
    el.dataset.swRelatedRail = 'premium-step-scroll-ready';

    el.addEventListener('pointerenter', function(event){
      if(event.pointerType && event.pointerType !== 'mouse') return;
      state.hoverPaused = true;
      clearTimers();
    });

    el.addEventListener('pointerleave', function(event){
      if(event.pointerType && event.pointerType !== 'mouse') return;
      state.hoverPaused = false;
      if(!state.stoppedByCustomer) startSoon();
    });

    el.addEventListener('pointerdown', function(event){
      if(event.pointerType && event.pointerType !== 'mouse'){
        stopForCustomer();
        return;
      }
      if(typeof event.button === 'number' && event.button !== 0) return;

      stopForCustomer();
      state.dragging = true;
      state.moved = false;
      state.suppressClick = false;
      state.startX = event.clientX;
      state.startScrollLeft = el.scrollLeft;
      state.pointerId = event.pointerId;
      el.classList.add('is-dragging');

      if(el.setPointerCapture){
        try{ el.setPointerCapture(state.pointerId); }catch(error){}
      }
    });

    el.addEventListener('pointermove', function(event){
      if(!state.dragging) return;
      var deltaX = event.clientX - state.startX;
      if(Math.abs(deltaX) > DRAG_THRESHOLD){
        state.moved = true;
        state.suppressClick = true;
      }
      el.scrollLeft = state.startScrollLeft - deltaX;
      if(state.moved) event.preventDefault();
    }, { passive:false });

    function finishDrag(){
      if(!state.dragging) return;
      state.dragging = false;
      el.classList.remove('is-dragging');
      if(state.pointerId !== null && el.releasePointerCapture){
        try{ el.releasePointerCapture(state.pointerId); }catch(error){}
      }
      state.pointerId = null;
    }

    el.addEventListener('pointerup', finishDrag);
    el.addEventListener('pointercancel', finishDrag);
    el.addEventListener('lostpointercapture', finishDrag);

    el.addEventListener('touchstart', stopForCustomer, { passive:true });
    el.addEventListener('wheel', stopForCustomer, { passive:true });
    el.addEventListener('focusin', stopForCustomer);
    el.addEventListener('dragstart', function(event){ event.preventDefault(); });

    el.addEventListener('click', function(event){
      stopForCustomer();
      if(!state.suppressClick) return;
      event.preventDefault();
      event.stopPropagation();
      state.suppressClick = false;
    }, true);
  }

  function observeRailContent(){
    var el = rail();
    if(!el) return;
    state.rail = el;
    prepareRail(el);

    if(state.mutationObserver) state.mutationObserver.disconnect();
    if(window.MutationObserver){
      state.mutationObserver = new MutationObserver(function(){
        resetForProduct();
      });
      state.mutationObserver.observe(el, { childList:true });
    }
  }

  function refresh(){
    observeRailContent();
    window.requestAnimationFrame(function(){
      window.requestAnimationFrame(resetForProduct);
    });
  }

  window.StaplefordRelatedRail = { refresh:refresh, stop:stopForCustomer };

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', refresh);
  }else{
    refresh();
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) clearTimers();
    else if(!state.stoppedByCustomer) startSoon();
  });

  document.addEventListener('stapleford:product-opened', refresh);

  document.addEventListener('click', function(event){
    if(event.target && event.target.closest && event.target.closest('.watch-card, .lightbox-related-card')){
      window.setTimeout(refresh, 0);
      window.setTimeout(refresh, 350);
    }
  }, true);

  if(reduceMotionQuery){
    var onMotionChange = function(event){
      reduceMotion = !!event.matches;
      if(reduceMotion) clearTimers();
      else if(!state.stoppedByCustomer) startSoon();
    };

    if(reduceMotionQuery.addEventListener) reduceMotionQuery.addEventListener('change', onMotionChange);
    else if(reduceMotionQuery.addListener) reduceMotionQuery.addListener(onMotionChange);
  }
})();
</script>
