:root{
  --gap:2px;
  --max-width:935px;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  
  color:#000;
  background:#fff;
}

/* LOGO */
.logo{
  width:min(100vw,var(--max-width));
  margin:8px auto 0px;
  display:flex;
  justify-content:center;
}

.logo img{
  max-width:90px;
  width:100%;
}

/* NAV */
.nav{
  width:min(100vw,var(--max-width));
  margin:0 auto 4px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 6px;
}

.left-icons{
  display:flex;
  gap:12px;
  font-size:12px;
  align-items:center;
}

.left-icons a{
  text-decoration:none;
  color:#000;
  text-transform:uppercase;
  line-height:1;
}

.nav-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  min-width:96px;
  font-size:12px;
  line-height:1;
  text-transform:uppercase;
  white-space:nowrap;
}

.uk-time-separator{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1ch;
  line-height:1;
}


.uk-time{
  font-family:'InterEmbedded', Arial, sans-serif !important;
  font-weight:500 !important;
  letter-spacing:0.02em;
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
}

.uk-time-digits{
  display:inline-block;
  width:8ch;
  text-align:left;
  font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum' 1, 'lnum' 1;
}

.filter{
  padding:0;
  border:none;
  background:transparent;
  font-size:12px;
  cursor:pointer;
  appearance:none;
  
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--gap);
  width:min(100vw,var(--max-width));
  margin:0 auto;
}

.card{
  display:flex;
  flex-direction:column;
  position:relative;
}

.image{
  aspect-ratio:4/5;
  overflow:hidden;

    hour:'2-digit',
    minute:'2-digit',
    second:'2-digit',
    hour12:false
  }).formatToParts(now);
  const hh = parts.find(p=>p.type==='hour')?.value || '';
  const mm = parts.find(p=>p.type==='minute')?.value || '';
  const ss = parts.find(p=>p.type==='second')?.value || '';
  el.textContent = `${hh}:${mm}:${ss}`;
}

function getWatchYear(w){
  const rawYear = w.specs && w.specs.year ? String(w.specs.year).trim() : "";
  const match = rawYear.match(/\d{4}/);
  return match ? parseInt(match[0], 10) : 0;
}

function getEnquiryData(w){
  const watchName = `${w.brand} ${w.title}`.trim();
  const message = `Hi Stapleford Watches, I am interested in the ${watchName}. Is it still available?`;
  const subject = `Enquiry: ${watchName}`;
  return {
    watchName,
    whatsapp: `https://wa.me/447438196047?text=${encodeURIComponent(message)}`,
    email: `mailto:ben@staplefordwatches.co.uk?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`
  };
}


function getWatchImages(w){
  const cover = w.image ? [w.image] : [];

  if(Array.isArray(w.gallery) && w.gallery.length){
    const items = w.gallery.filter(Boolean);
    return items.length ? items : cover;
  }

  if(Array.isArray(w.images) && w.images.length){
    const items = w.images.filter(Boolean);
    return items.length ? items : cover;
  }

  if(Array.isArray(w.detailImages) && w.detailImages.length){
    const items = w.detailImages.filter(Boolean);
    return items.length ? items : cover;
  }

  return cover;
}

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxThumbs = document.getElementById("lightboxThumbs");
const lightboxMeta = document.getElementById("lightboxMeta");
const lightboxEnquire = document.getElementById("lightboxEnquire");
const lightboxEnquireTrigger = document.getElementById("lightboxEnquireTrigger");
const lightboxEnquireOverlay = document.getElementById("lightboxEnquireOverlay");
const lightboxEnquireHide = document.getElementById("lightboxEnquireHide");
const lightboxWhatsapp = document.getElementById("lightboxWhatsapp");
const lightboxEmail = document.getElementById("lightboxEmail");
let lightboxImages = [];
let lightboxIndex = 0;
let lightboxTitle = "";
let lightboxWatch = null;

function renderLightbox(){
  if(!lightboxImages.length) return;
  lightboxImage.src = lightboxImages[lightboxIndex];
  lightboxImage.alt = `${lightboxTitle} image ${lightboxIndex + 1}`;
  lightboxMeta.textContent = `${lightboxTitle} · ${lightboxIndex + 1}/${lightboxImages.length}`;
  lightboxThumbs.innerHTML = lightboxImages.map((src, idx) =>
    `<img class="lightbox-thumb ${idx===lightboxIndex ? 'active' : ''}" src="${src}" alt="${lightboxTitle} thumbnail ${idx + 1}" data-index="${idx}" onclick="event.stopPropagation();">`
  ).join("");

  if(lightboxWatch && lightboxWatch.status === "available") {
    const enquiryData = getEnquiryData(lightboxWatch);
    if(lightboxWhatsapp) lightboxWhatsapp.href = enquiryData.whatsapp;
    if(lightboxEmail) lightboxEmail.href = enquiryData.email;
    if(lightboxEnquire) {
      lightboxEnquire.hidden = false;
      lightboxEnquire.classList.remove("show-enquire");
    }
    if(lightboxEnquireTrigger) lightboxEnquireTrigger.setAttribute("aria-expanded", "false");
    if(lightboxEnquireOverlay) lightboxEnquireOverlay.setAttribute("aria-hidden", "true");
  } else if(lightboxEnquire) {
    lightboxEnquire.hidden = true;
  }
}

function openLightbox(w, startIndex = 0){
  lightboxWatch = w;
  lightboxImages = getWatchImages(w);
  if(!lightboxImages.length) return;
  lightboxTitle = `${w.brand} ${w.title}`.trim();
  lightboxIndex = Math.max(0, Math.min(startIndex, lightboxImages.length - 1));
  renderLightbox();
  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeLightbox(){
  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  lightboxWatch = null;
  if(lightboxEnquire){
    lightboxEnquire.hidden = true;
    lightboxEnquire.classList.remove("show-enquire");
  }
  if(lightboxEnquireTrigger) lightboxEnquireTrigger.setAttribute("aria-expanded", "false");
  if(lightboxEnquireOverlay) lightboxEnquireOverlay.setAttribute("aria-hidden", "true");
}

function stepLightbox(direction){
  if(!lightboxImages.length) return;
  lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
  renderLightbox();
}

lightbox?.addEventListener("click", (e) => {
  if(e.target === lightbox){
    closeLightbox();
  }
});

document.addEventListener("click", (e) => {
  if(!lightbox?.classList.contains("open")) return;
  if(!lightboxEnquire || !lightboxEnquire.classList.contains("show-enquire")) return;
  if(e.target.closest("#lightboxEnquire")) return;
  lightboxEnquire.classList.remove("show-enquire");
  lightboxEnquireTrigger?.setAttribute("aria-expanded", "false");
  lightboxEnquireOverlay?.setAttribute("aria-hidden", "true");
});

document.querySelector(".lightbox-close")?.addEventListener("click", closeLightbox);
document.querySelector(".lightbox-prev")?.addEventListener("click", (e) => {
  e.stopPropagation();
  stepLightbox(-1);
});
document.querySelector(".lightbox-next")?.addEventListener("click", (e) => {
  e.stopPropagation();
  stepLightbox(1);
});

document.querySelector(".lightbox-image-wrap")?.addEventListener("click", (e) => {
  if(e.target.closest("#lightboxEnquire")) return;
  stepLightbox(1);
});

lightboxEnquireTrigger?.addEventListener("click", (e) => {
  e.stopPropagation();
  lightboxEnquire?.classList.add("show-enquire");
  lightboxEnquireTrigger.setAttribute("aria-expanded", "true");
  lightboxEnquireOverlay?.setAttribute("aria-hidden", "false");
});

lightboxEnquireHide?.addEventListener("click", (e) => {
  e.stopPropagation();
  lightboxEnquire?.classList.remove("show-enquire");
  lightboxEnquireTrigger?.setAttribute("aria-expanded", "false");
  lightboxEnquireOverlay?.setAttribute("aria-hidden", "true");
});

lightboxEnquireOverlay?.addEventListener("click", (e) => {
  e.stopPropagation();
});

lightboxThumbs?.addEventListener("click", (e) => {
  const thumb = e.target.closest(".lightbox-thumb");
  if(!thumb) return;
  e.stopPropagation();
  lightboxIndex = Number(thumb.dataset.index || 0);
  renderLightbox();
});

lightboxThumbs?.addEventListener("pointerdown", (e) => {
  const thumb = e.target.closest(".lightbox-thumb");
  if(!thumb) return;
  e.preventDefault();
  e.stopPropagation();
  lightboxIndex = Number(thumb.dataset.index || 0);
  renderLightbox();
});

document.addEventListener("keydown", (e) => {
  if(!lightbox.classList.contains("open")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowLeft") stepLightbox(-1);
  if(e.key === "ArrowRight") stepLightbox(1);
});


function render(){
 let items=[...watches];

 if(showAvailable || showSold){
  items = items.filter(w => {
    return (showAvailable && w.status === "available") || (showSold && w.status === "sold");
  });
 }

 if(searchQuery){
  items = items.filter(w => {
    const brand = (w.brand || "").toLowerCase();
    const title = (w.title || "").toLowerCase();
    return brand.includes(searchQuery) || title.includes(searchQuery);
  });
 }

 switch(currentSort){
  case "price-low": items.sort((a,b)=>a.price-b.price); break;
  case "price-high": items.sort((a,b)=>b.price-a.price); break;
  case "brand-az": items.sort((a,b)=>a.brand.localeCompare(b.brand)); break;
  case "brand-za": items.sort((a,b)=>b.brand.localeCompare(a.brand)); break;
  case "new-old": items.sort((a,b)=>getWatchYear(b)-getWatchYear(a)); break;
  case "old-new": items.sort((a,b)=>getWatchYear(a)-getWatchYear(b)); break;
 }

 items.sort((a,b)=>Number(a.status === "sold") - Number(b.status === "sold"));

 gallery.innerHTML="";

 const noResults = document.getElementById("noResults");
 const hasResults = items.length > 0;

 if(noResults){
  noResults.hidden = hasResults;
 }

 document.body.classList.toggle("no-results-active", !hasResults);

 items.forEach((w,i)=>{
  const div=document.createElement("div");
  div.className="card";
  const isAvailable = w.status === "available";

  div.innerHTML=`
    <div class="image ${w.status==="sold"?"sold":""} ${isAvailable?"available":""}">
      <img src="${w.image}" loading="${i<3?'eager':'lazy'}" draggable="false" oncontextmenu="return false;" ondragstart="return false;">
      ${isAvailable ? `
      <button class="spec-trigger" type="button" aria-expanded="false">
        <span>SPEC ↑</span>
        
      </button>
      <div class="spec-overlay" aria-hidden="true">
        <button class="spec-hide" type="button" aria-label="Hide specifications">
          <span>HIDE ↓</span>
          
        </button>
        <div class="spec-list">
          <div class="spec-row"><span class="spec-label">YEAR</span><span class="spec-value">${w.specs.year}</span></div>
          <div class="spec-row"><span class="spec-label">CASE SIZE</span><span class="spec-value">${w.specs.caseSize}</span></div>
          <div class="spec-row"><span class="spec-label">COLOUR</span><span class="spec-value">${w.specs.colour}</span></div>
          <div class="spec-row"><span class="spec-label">CONDITION</span><span class="spec-value">${w.specs.condition}</span></div>
          <div class="spec-row"><span class="spec-label">CONTENTS</span><span class="spec-value">${w.specs.contents}</span></div>
        </div>
      </div>` : ""}
    </div>
    <div class="info">
      <div class="title"><div class="brand">${w.brand.toUpperCase()}</div><div>${w.title}</div></div>
      <div class="info-right">
        <div class="price">${w.status==="sold" ? "SOLD" : "£"+w.price.toLocaleString()}</div>
      </div>
    </div>
  `;

  if(isAvailable){
    const image = div.querySelector('.image.available');
    const trigger = div.querySelector('.spec-trigger');
    const hideBtn = div.querySelector('.spec-overlay .spec-hide');
    trigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = image.classList.contains('show-spec');
      if(isOpen){
        image.classList.remove('show-spec');
        trigger.setAttribute('aria-expanded', 'false');
      } else {
        image.classList.add('show-spec');
        trigger.setAttribute('aria-expanded', 'true');
      }
    });

    hideBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      image.classList.remove('show-spec');
      trigger.setAttribute('aria-expanded', 'false');
    });

    image.addEventListener('click', (event) => {
      const clickedControl = event.target.closest('.spec-trigger, .spec-overlay, .spec-hide, a, button');
      if(clickedControl) return;
      openLightbox(w, 0);
    });

    document.addEventListener('click', (event) => {
      if(!div.contains(event.target)){
        image.classList.remove('show-spec');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
  }

  gallery.appendChild(div);
 });
}


render();

<script>

document.addEventListener('copy', function(e){

}, true);

}, true);

document.addEventListener('keydown', function(e){
  const key = (e.key || '').toLowerCase();
  const isMod = e.ctrlKey || e.metaKey;
  if (isMod && ['c','x','a','s','u','p'].includes(key)) {
    e.preventDefault();
  }
  if (key === 'printscreen') {
    e.preventDefault();
  }
}, true);

document.addEventListener('mousedown', function(e){
  if (e.detail > 1) e.preventDefault();
}, true);

document.addEventListener('selectstart', function(e){
  e.preventDefault();
}, true);

document.addEventListener('contextmenu', function(e){
  e.preventDefault();
}, true);
